info:
  name: Post All Characters
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/characters
  body:
    type: json
    data: |-
      {
        "name": "Ren Amamiya",
        "codename": "Joker",
        "initialPersona": "Arsene",
        "element": "Curse",
        "rarity": 5
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
